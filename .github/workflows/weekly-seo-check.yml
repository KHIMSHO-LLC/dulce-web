# Weekly crawl of the live site: every sitemap URL 200, self-canonical, one <h1>,
# internal links without redirects, and every JSON-LD block valid. A failed run
# emails the repo owner (GitHub's default Actions notification).
name: Weekly SEO check
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      BASE: https://dulceglucosa.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings scripts/crawl.mts
      - run: node --no-warnings scripts/check-jsonld.mts
