# Pings IndexNow with every sitemap URL once Vercel reports a successful
# production deployment (Vercel's GitHub integration posts deployment statuses).
name: IndexNow
on:
  deployment_status:
jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
